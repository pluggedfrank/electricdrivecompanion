# Baut die App und fährt die Tests, bei jedem Push.
#
# Zweck: Compilerfehler sollen hier auftauchen und nicht auf einem Rechner, von
# dem sie jemand abtippen muss. Der Build braucht keinen echten API-Key, er muss
# nur übersetzen; die Schlüsseldatei wird deshalb mit einem Platzhalter erzeugt.
#
# Kosten im Blick behalten: macOS-Läufer zählen bei privaten Repositories
# zehnfach. Deshalb läuft der Build nur, wenn sich am App-Code wirklich etwas
# ändert, und die Tests laufen getrennt auf einem Linux-Läufer.

name: Build

on:
  push:
    paths:
      - 'LadeRoute/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'LadeRoute/**'
      - 'project.yml'
  workflow_dispatch:

jobs:
  tests:
    name: Tests der geteilten Logik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        working-directory: tools
        run: npm test

  build:
    name: iOS-Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Schlüsseldatei mit Platzhalter anlegen
        # Zum Übersetzen genügt irgendein Wert. Ein echter Key hat im Build
        # nichts zu suchen, die App fragt ihn zur Laufzeit ab.
        run: sed 's|YOUR_API_KEY|CIPLACEHOLDERKEY0000000000000000|' Secrets.xcconfig.example > Secrets.xcconfig

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Bauen
        # generic/platform vermeidet, einen Gerätenamen zu raten, den es auf dem
        # Läufer vielleicht nicht gibt. Signieren entfällt.
        run: |
          set -o pipefail
          xcodebuild \
            -project LadeRoute.xcodeproj \
            -scheme LadeRoute \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Fertige App prüfen
        # Uebersetzen ist nicht dasselbe wie installieren. Die Info.plist hatte
        # keinen CFBundleIdentifier: Der Build lief gruen durch, der Simulator
        # verweigerte die Installation mit "Missing Bundle ID". Ein Blick in das
        # fertige Bundle faengt genau das ab.
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "Kein .app-Bundle gebaut." >&2
            exit 1
          fi
          echo "Bundle: $APP"
          PLIST="$APP/Info.plist"

          lies() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" 2>/dev/null || true; }

          fehler=0
          for schluessel in CFBundleIdentifier CFBundleExecutable CFBundleName CFBundleVersion; do
            wert=$(lies "$schluessel")
            echo "  $schluessel = ${wert:-(fehlt)}"
            if [ -z "$wert" ]; then
              echo "    fehlt, die App liesse sich nicht installieren" >&2
              fehler=1
            fi
            case "$wert" in
              *'$('*) echo "    nicht ersetzt, Build-Einstellung fehlt" >&2; fehler=1 ;;
            esac
          done

          if [ "$(lies CFBundleIdentifier)" != "de.plugged.laderoute" ]; then
            echo "  Unerwartete Bundle-Kennung." >&2
            fehler=1
          fi

          exit $fehler

      - name: Build-Protokoll aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Fehler und Warnungen zusammenfassen
        if: always()
        run: |
          # Auch auf die Standardausgabe, nicht nur in die Zusammenfassung.
          # Im Protokoll stehen die Meldungen sonst mitten zwischen tausend
          # Zeilen Compilerbuchhaltung, und wer das Protokoll von hinten liest,
          # findet nur den Artefakt-Upload.
          {
            echo "### Compiler-Meldungen"
            echo '```'
            grep -E "(error|warning):" build.log | sort -u | head -60 || echo "keine"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
