# XcodeGen-Spezifikation.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open LadeRoute.xcodeproj
#
# Wer XcodeGen nicht installieren will, legt in Xcode ein leeres iOS-App-Projekt
# an und zieht den Ordner LadeRoute hinein. Die Paketabhängigkeiten stehen unten.

name: LadeRoute

options:
  bundleIdPrefix: live.punkt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Das Core-Paket enthält Karte, Routing und Standort. Der Zugang läuft allein
  # über den API-Key, es braucht keinen Vertrag mit dem TomTom-Vertrieb.
  # Das separate Paket tomtom-sdk-spm-navigation (Turn-by-Turn) ist hier bewusst
  # nicht eingebunden.
  TomTomCore:
    url: https://github.com/tomtom-international/tomtom-sdk-spm-core
    exactVersion: 0.73.2

targets:
  LadeRoute:
    type: application
    platform: iOS
    sources:
      - path: LadeRoute
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        INFOPLIST_FILE: LadeRoute/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: live.punkt.laderoute
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: TomTomCore
        product: TomTomSDKMapDisplay
      - package: TomTomCore
        product: TomTomSDKLocationProvider
      - package: TomTomCore
        product: TomTomSDKRoute
      - package: TomTomCore
        product: TomTomSDKRoutePlanner
      - package: TomTomCore
        product: TomTomSDKRoutePlannerOnline
      - package: TomTomCore
        product: TomTomSDKRoutingCommon
      - package: TomTomCore
        product: TomTomSDKCommon
